<!--
  Plantilla de la imagen del producto, envuelta en un enlace <a> a la ficha (PDP).
    - href={pdpUrl}         → URL de la ficha (la calcula el JS). Permite "abrir en
                              pestaña nueva". Si está vacío, el <a> no enlaza.
    - onclick={handleClick} → navega dentro de la SPA (preventDefault + Navigate).
    - <img loading="lazy">  → la imagen se descarga solo cuando entra en pantalla.
    - onerror={handleError} → si la imagen no carga, pasamos a mostrar un placeholder.
-->
<template>
    <a href={pdpUrl} class="image-link" title={computedAlt} onclick={handleClick}>
        <div class="image-frame">
            <!-- Si hay URL válida y no falló, mostramos la imagen; si no, un placeholder. -->
            <template lwc:if={showImage}>
                <img
                    class="product-image"
                    src={resolvedUrl}
                    alt={computedAlt}
                    loading="lazy"
                    decoding="async"
                    onerror={handleError}
                />
            </template>
            <!-- Estado "sin imagen": se muestra si la URL falla (rota/CSP) o no hay. -->
            <template lwc:else>
                <div class="placeholder" aria-hidden="true">
                    <svg
                        class="placeholder-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <path d="M21 15l-5-5L5 21"></path>
                    </svg>
                    <span class="placeholder-text">Sin imagen</span>
                </div>
            </template>
        </div>
    </a>
</template>
